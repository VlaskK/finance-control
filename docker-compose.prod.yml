# Production-оверрайд для сервера (Рег.облако), режим «только бот».
# Наружу ничего не публикуем: бот ходит к Telegram сам (long polling),
# входящие порты не нужны. Postgres и API общаются внутри docker-сети.
#
# Запуск на сервере:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    # убираем публикацию 5432 наружу — БД доступна только другим контейнерам
    ports: []

  api:
    # убираем публикацию 3000 наружу — публичного (неаутентифицированного) API нет
    ports: []
    # с РФ-серверов подсеть Telegram 149.154.166.x заблокирована, а 149.154.167.220 доступна;
    # DNS выдаёт заблокированный IP, поэтому пиним рабочий (если бот перестанет отвечать —
    # первым делом проверить curl'ом, жив ли этот IP, и подобрать новый)
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
